# M-ACE2S paper | 4deg, GMR off, uniform masking (up to 20 vars) | evaluation (inference suite)
#
# Exact config run for the paper (body below is unmodified).
# Run from the root of https://github.com/ai2cm/ace checked out at the commit below:
#   ACE commit differs per seed (the commits differ only in run-config files, not code):
#     seeds 0,1,2,3: 41ce903b9e3916a7a0a3465dfc4f511fea40ac4e (branch exp/alexey8)
#       https://github.com/ai2cm/ace/tree/41ce903b9e3916a7a0a3465dfc4f511fea40ac4e
#     seed 4: 7fc7e77a267443f8c78334b1eab4f079803d3eb7 (branch exp/alexey8)
#       https://github.com/ai2cm/ace/tree/7fc7e77a267443f8c78334b1eab4f079803d3eb7
#   python -I configs/experiments/2026-06-30-var-masking/run_eval_suite.py path/to/gmroff-mask20-eval.yaml
#   (1 GPU; original path in ACE repo: configs/experiments/2026-06-30-var-masking/run_configs/ace-eval-suite-config-4deg-nc-sfno-era5-gmroff-mask20-co2default-seed<N>-v3.yaml)
#
# Input checkpoint: `/ckpt.tar` is `training_checkpoints/best_inference_ckpt.tar`
# written by 4deg/gmroff-mask20-train.yaml (same seed).
#
# Identical config for all seeds below.
#
# Paper figures: fig:46yr_era5_T7_bern_4deg, fig:46yr_era5_T7_4deg, fig:46yr_era5_T0_4deg, fig:46yr_era5_Q3_4deg, fig:46yr_era5_TWP_4deg, fig:46yr_era5_Psfc_4deg, fig:46yr_time_mean_rmse_era5_4deg, fig:46yr_time_mean_bias_era5_4deg
#
# Data paths (/climate-default/...) are Ai2-internal; see ../README.md.
#
# Runs (Ai2-internal links; wandb project is private):
#   seed 0: wandb https://wandb.ai/ai2cm/VarMasking8/runs/pjlrgo4g | beaker 01KY43H5KQ5SR63BYA3T1883E4 | commit 41ce903b9
#   seed 1: wandb https://wandb.ai/ai2cm/VarMasking8/runs/ffl0f9g8 | beaker 01KY43HJVPT32SHH7D5RPY85YG | commit 41ce903b9
#   seed 2: wandb https://wandb.ai/ai2cm/VarMasking8/runs/r5u8xhpg | beaker 01KY43J01KT19YKH0EH28JXNBM | commit 41ce903b9
#   seed 3: wandb https://wandb.ai/ai2cm/VarMasking8/runs/1xaych9n | beaker 01KY43JC3754Y504MDPW9KK5FA | commit 41ce903b9
#   seed 4: wandb https://wandb.ai/ai2cm/VarMasking8/runs/tyx3vshs | beaker 01KY57XRVXP064QGWJHR474XA6 | commit 7fc7e77a2

experiment_dir: /results
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: VarMasking8
  entity: ai2cm
inferences:
- name: 10year
  config:
    experiment_dir: /results/10year
    n_forward_steps: 3652
    forward_steps_in_memory: 73
    checkpoint_path: /ckpt.tar
    logging:
      log_to_screen: true
      log_to_wandb: true
      log_to_file: true
      project: VarMasking8
      entity: ai2cm
    loader:
      start_indices:
        times:
        - '2015-01-01T00:00:00'
        - '2015-01-02T00:00:00'
        - '2015-01-03T00:00:00'
        - '2015-01-04T00:00:00'
        - '2015-01-05T00:00:00'
        - '2015-01-06T00:00:00'
        - '2015-01-07T00:00:00'
        - '2015-01-08T00:00:00'
      dataset:
        data_path: /climate-default
        file_pattern: 2026-04-17-era5-4deg-8layer-daily-1940-2025.zarr
        engine: zarr
      num_data_workers: 4
    aggregator:
      step_means:
      - step: 5
        target: denorm
        name: day_5
        variables: &id001
        - PRATEsfc
        - TMP2m
        - Q2m
        - UGRD10m
        - VGRD10m
        - h500
        - TMP850
        - PRESsfc
        - surface_temperature
