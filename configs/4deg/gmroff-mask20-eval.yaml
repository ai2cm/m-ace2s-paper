        - air_temperature_2
        - air_temperature_3
        - air_temperature_4
        - air_temperature_5
        - air_temperature_6
        - air_temperature_7
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - eastward_wind_0
        - eastward_wind_1
        - eastward_wind_2
        - eastward_wind_3
        - eastward_wind_4
        - eastward_wind_5
        - eastward_wind_6
        - eastward_wind_7
        - northward_wind_0
        - northward_wind_1
        - northward_wind_2
        - northward_wind_3
        - northward_wind_4
        - northward_wind_5
        - northward_wind_6
        - northward_wind_7
        - total_water_path
      - step: 5
        target: norm
        name: day_5_norm
        variables: *id001
      ensembles: []
      mean_denorm:
        enabled: false
        target: denorm
      mean_norm:
        enabled: false
        target: norm
      enso_index:
        enabled: false
      enso_coefficient:
        enabled: false
      histogram:
        enabled: true
    data_writer:
      save_prediction_files: false
      save_monthly_files: false
    n_ensemble_per_ic: 1
