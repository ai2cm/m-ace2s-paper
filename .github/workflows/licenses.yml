name: licenses

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  third-party-notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: THIRD_PARTY_NOTICES.md lists exactly the dependencies in pyproject.toml
        run: |
          python3 - <<'EOF'
          import re, sys, tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          notices = open("THIRD_PARTY_NOTICES.md", encoding="utf-8").read()
          norm = lambda s: re.sub(r"[-_.]+", "-", s).lower()
          deps = project["dependencies"] + sum(project.get("optional-dependencies", {}).values(), [])
          pin = re.compile(r"\s*([A-Za-z0-9_.-]+)\s*(?:\[[^\]]*\])?\s*==\s*([^\s;,]+)\s*(?:;.*)?")
          unpinned = [d for d in deps if not pin.fullmatch(d)]
          if unpinned:
              sys.exit("pin these with == so their versions can be checked: " + ", ".join(unpinned))
          declared = {(norm(m[1]), m[2]) for m in map(pin.fullmatch, deps)}
          listed = {(norm(n), v) for n, v in re.findall(r"^- \*\*(\S+)\*\* (\S+) — ", notices, re.M)}
          errors = [f"not in THIRD_PARTY_NOTICES.md: {n}=={v}" for n, v in sorted(declared - listed)]
          errors += [f"not in pyproject.toml (stale entry): {n}=={v}" for n, v in sorted(listed - declared)]
          if errors:
              sys.exit("\n".join(errors))
          print(f"THIRD_PARTY_NOTICES.md matches all {len(declared)} dependencies in pyproject.toml.")
          EOF
      - name: License report for the dependencies in pyproject.toml
        run: |
          uv sync --frozen --all-extras
          uv run --frozen --with pip-licenses==5.5.5 pip-licenses --from=mixed --format=markdown --with-urls \
            --packages $(python3 -c 'import re, tomllib; p = tomllib.load(open("pyproject.toml", "rb"))["project"]; print(" ".join(re.match(r"\s*[A-Za-z0-9_.-]+", d)[0].strip() for d in p["dependencies"] + sum(p.get("optional-dependencies", {}).values(), [])))')
